# Hearth Shaders
oldLighting=false
oldHandLight=false
separateAo=false
underwaterOverlay=false
vignette=false
sun=true
moon=true
clouds=off

# water writes its normal to colortex1 without blending
blend.gbuffers_water.colortex1=off
blend.gbuffers_water.colortex2=off
# Distant Horizons far water draws nothing itself (composite paints it); keep it see-through
blend.dh_water=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA

screen=<profile> LOOK_STYLE [LOOK] [SKY] [LIGHTING] [WATER] [ATMOSPHERE] [POST]
screen.LIGHTING=SHADOWS SUN_BRIGHTNESS AMBIENT_BRIGHTNESS TORCH_BRIGHTNESS SHADOW_SOFTNESS SHADOW_SAMPLES shadowMapResolution shadowDistance sunPathRotation WAVING_PLANTS
screen.WATER=WATER_STYLE GLACIAL_START REAL_WAVES WATER_HOLE_DEBUG WAVE_QUALITY WAVE_RANGE WAVE_FOAM BOAT_WAKES WAVE_DETAIL_DIST WATER_WAVES WATER_WAVE_STRENGTH WATER_SWELL_ON WATER_SWELL_HEIGHT WATER_REFLECTIONS CAUSTICS WATER_CLARITY
screen.ATMOSPHERE=HORIZON_HAZE CLOUD_STYLE CLOUD_QUALITY CLOUD_COVERAGE SKY_BRIGHTNESS FOG_DENSITY EDGE_FOG_START VALLEY_MIST GODRAYS GODRAY_STRENGTH
screen.LOOK=LOOK_STYLE PASTEL_AMOUNT SUN_GLOW_SIZE CLOUD_PUFFINESS EVERGREEN_DEPTH SHADOW_COOLNESS BLACK_LIFT WARM_ACCENT_POP MOOD_CONTRAST FOREST_FOG MOUNTAIN_CLOUDS
screen.SKY=SUNRISE_STYLE MORNING_STYLE MIDDAY_STYLE AFTERNOON_STYLE SUNSET_STYLE NIGHT_STYLE DAY_INTENSITY SUNSET_INTENSITY ALPENGLOW NIGHT_BRIGHTNESS NIGHT_FOG MOON_SIZE MOON_BRIGHTNESS MOON_HALO STAR_AMOUNT
screen.POST=BLOOM GENERATED_NORMALS GEN_NORMAL_STRENGTH COATED_TEXTURES WORLD_OUTLINE WORLD_OUTLINE_STRENGTH PNW_GRADE WINTER_GRADE EXPOSURE BLOOM_STRENGTH SATURATION WARMTH VIGNETTE

sliders=DAY_INTENSITY GEN_NORMAL_STRENGTH WORLD_OUTLINE_STRENGTH PASTEL_AMOUNT SUN_GLOW_SIZE CLOUD_PUFFINESS SUNSET_INTENSITY ALPENGLOW NIGHT_BRIGHTNESS NIGHT_FOG MOON_SIZE MOON_BRIGHTNESS MOON_HALO STAR_AMOUNT HORIZON_HAZE EVERGREEN_DEPTH SHADOW_COOLNESS BLACK_LIFT WARM_ACCENT_POP MOOD_CONTRAST FOREST_FOG MOUNTAIN_CLOUDS GLACIAL_START WAVE_QUALITY WAVE_RANGE WATER_SWELL_HEIGHT WAVE_FOAM WAVE_DETAIL_DIST WINTER_GRADE EDGE_FOG_START CLOUD_STYLE CLOUD_QUALITY WATER_STYLE CLOUD_COVERAGE VALLEY_MIST PNW_GRADE SUN_BRIGHTNESS AMBIENT_BRIGHTNESS TORCH_BRIGHTNESS SHADOW_SOFTNESS SHADOW_SAMPLES shadowMapResolution shadowDistance sunPathRotation WATER_WAVE_STRENGTH WATER_CLARITY SKY_BRIGHTNESS FOG_DENSITY GODRAY_STRENGTH EXPOSURE BLOOM_STRENGTH SATURATION WARMTH

# like the friends Complementary setup: no shadows from mobs, items or chests (saves a lot in the shadow pass)
shadowEntities=false
shadowBlockEntities=false
shadowPlayer=true

# Teleport / big jump detector: 1 right after the camera jumps more than 24 blocks in a frame, then fades out over
# ~6-8 s. Distant Horizons keeps its far land placed for the OLD position for a few seconds after a teleport
# (a bowl of terrain hanging in the sky); composite hides the far land in the horizon haze while this is up.
variable.float.hJump = abs(cameraPosition.x - previousCameraPosition.x) + abs(cameraPosition.y - previousCameraPosition.y) + abs(cameraPosition.z - previousCameraPosition.z)
uniform.float.hearthSettle = smooth(if(hJump > 24.0, 1.0, 0.0), 0.01, 2.0)

# Performance: switch whole passes off, not just weaken them
program.shadow.enabled=SHADOWS
program.composite1.enabled=GODRAYS

# One-click profiles (top of Shader Options). Laptop is the default: tuned for a fanless MacBook Air.
profile.POTATO=!GENERATED_NORMALS !WORLD_OUTLINE !SHADOWS !GODRAYS !BLOOM !WATER_REFLECTIONS !CAUSTICS !WAVING_PLANTS CLOUD_STYLE=1 WAVE_RANGE=48.0 WAVE_FOAM=0.5 shadowMapResolution=1024 shadowDistance=64.0
profile.LAPTOP=GENERATED_NORMALS WORLD_OUTLINE SHADOWS !GODRAYS BLOOM WATER_REFLECTIONS !CAUSTICS WAVING_PLANTS CLOUD_STYLE=1 WAVE_RANGE=64.0 WAVE_FOAM=0.75 SHADOW_SAMPLES=1 shadowMapResolution=1024 shadowDistance=64.0
profile.BALANCED=GENERATED_NORMALS WORLD_OUTLINE SHADOWS GODRAYS BLOOM WATER_REFLECTIONS CAUSTICS WAVING_PLANTS CLOUD_STYLE=1 WAVE_RANGE=96.0 WAVE_FOAM=0.75 SHADOW_SAMPLES=1 shadowMapResolution=1536 shadowDistance=80.0
profile.HIGH=GENERATED_NORMALS WORLD_OUTLINE SHADOWS GODRAYS BLOOM WATER_REFLECTIONS CAUSTICS WAVING_PLANTS CLOUD_STYLE=2 WAVE_RANGE=128.0 WAVE_FOAM=1.0 SHADOW_SAMPLES=4 shadowMapResolution=2048 shadowDistance=128.0
